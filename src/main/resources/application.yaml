spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME}?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver


  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

logging:
  level:
    org.hibernate.SQL: debug

jwt:
  secret: ${JWT_SECRET}
  access-token-exp-seconds: ${JWT_ACCESS_TOKEN_EXP_SECONDS:900}
  refresh-token-exp-seconds: ${JWT_REFRESH_TOKEN_EXP_SECONDS:12096000}

#s3용
aws:
  s3:
    bucket: ${AWS_S3_BUCKET:ayden-community-s3}
    region: ${AWS_REGION:ap-northeast-2}

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 30MB
#k8s에서 검사할 liveness, readiness probe용 + ALB용
management:
  endpoints:
    web:
      exposure:
        include: health

  endpoint:
    health:
      probes:
        enabled: true
      livenessstate:
        enabled: true
      readinessstate:
        enabled: true
      group:
        readiness:
          include:
            - readinessState
            - db
#includ db -> db연결이 가능한지 확인용