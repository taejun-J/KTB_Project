server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}
      ?serverTimezone=UTC
      &sslMode=VERIFY_CA
      &trustCertificateKeyStoreUrl=file:/etc/mysql-tls/mysql-truststore.p12
      &trustCertificateKeyStoreType=PKCS12
      &trustCertificateKeyStorePassword=${TRUSTSTORE_PASSWORD}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:development}

jwt:
  secret: ${JWT_SECRET}
  access-token-exp-seconds: 900
  refresh-token-exp-seconds: 12096000