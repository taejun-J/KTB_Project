name: ayden-community-CI

#워크플로우 실행할 트리거
# main브랜치만 푸시에도 실행, dev는 공통으로 pr 닫힐때만
on:
  push:
    branches: [main]
  pull_request:
    branches: [dev]
#워크플로우 -> 깃 권한
permissions:
  contents: read

#워크플로우에서 실제 진행 할 작업
jobs:
  build:
    #runner -> self-hosted-runner 사용
#    runs-on: self-hosted
    runs-on: ubuntu-latest
    steps:
      #checkout Action 최신버전 v6, 내코드의 ver적는거 X
      - uses: actions/checkout@v6
      - name: Set up JDK21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      #gradle build 수행
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

