#ci부분은 ci.yml과 거의 동일
name: ayden-community-CI-CD

on:
  #main push때 실행되는 점이 차이
  #test때는 feature브랜치에 테스
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  #ci작업임을 명시하는 이름(ci라는 이름의 Job)
  ci:
    #마찬가지로 ubuntu버전 입력 latest X
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.4

        env:
          MYSQL_DATABASE: springdatajpa_ci
          MYSQL_USER: ktbUser
          MYSQL_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}

        ports:
          - 3306:3306

    env:
      DB_HOST: localhost
      DB_PORT: 3306
      DB_NAME: springdatajpa_ci
      DB_USERNAME: ktbUser
      DB_PASSWORD: ${{ secrets.CI_DB_PASSWORD }}
      JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      #도커 로그인
      - name: Docker Login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      #도커 이미지 빌드
      #github.sha -> 구분용 태그
      - name: Build Docker image
        run: docker build -t "${{ secrets.DOCKER_USERNAME }}/community-backend:${{ github.sha }}" .

      #도커 허브에 푸시
      - name: Push Docker image
        run: docker push "${{ secrets.DOCKER_USERNAME }}/community-backend:${{ github.sha }}"

  cd:
    #ci 성공시 -> cd진행하도록 추가
    needs: ci
    #마찬가지로 우분투 버전 명시
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      #oidc토큰 발급위해 추가
      id-token: write
      #Runner ip 확인 ~ 배스천SG에 runner ip추가 => test-bastion-sg.yml과 동일(공식문서)
    steps:
      #러너 ip 받아오기
      - name: Get GitHub Runner Public IP
        id: runner-ip
        run: |
            RUNNER_IP=$(curl -4 -fsSL https://checkip.amazonaws.com | tr -d '\n')
            
            if [ -z "$RUNNER_IP" ]; then
            echo "Runner IP 조회 실패"
            exit 1
            fi
            
            echo "Runner public IP: $RUNNER_IP"
            echo "cidr=${RUNNER_IP}/32" >> "$GITHUB_OUTPUT"
      #OIDC -> AWS인증
      - name: Configure AWS Credentials(OIDC)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ap-northeast-2
      #배스천 보안그룹에 러너IP추가
      - name: Add RunnerIP to bastion temp
        run: |
          aws ec2 authorize-security-group-ingress \
            --group-id "${{ secrets.BASTION_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.cidr }}"

      #도커 허브에서 이미지 가져오기
      #로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      #ci가 푸시한 것과 동일한 이미지 풀
      - name: Pull Docker image
        run: docker pull "${{ secrets.DOCKER_USERNAME }}/community-backend:${{ github.sha }}"

      #도커 이미지 받아서 러너가 이미지 -> .tar로 저장
      - name: Save Docker image
        run: |
          docker save \
            "${{ secrets.DOCKER_USERNAME }}/community-backend:${{ github.sha }}" \
            -o community-backend.tar
      #SSH명령어로 백엔드로 도커 이미지 받아와서 로드,실행 하는 부분
      #기존에 터미널에 쳤던 코드(프록시 점프) 그대로 자동실행하도록 추가
      #1. secrets에 있는 pem을 다시 파일로 바꿔서 아래 명령어에서 꺼내쓰게 변경
      - name: Configure SSH Key
        run: |
          mkdir -p ~/.ssh

          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" \
            > ~/.ssh/aydenKey.pem

          chmod 600 ~/.ssh/aydenKey.pem
      #2. tar파일을 프록시 점프로 백엔드ec2에 전달(복사)
      - name: Copy Docker image to Backend
        run: |
          scp \
            -i ~/.ssh/aydenKey.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/aydenKey.pem -o StrictHostKeyChecking=no -W %h:%p ubuntu@${{ secrets.BASTION_HOST }}" \
            community-backend.tar \
            ubuntu@${{ secrets.BACKEND_PRIVATE_IP }}:/tmp/community-backend.tar

      #3. 실제 배포(이미지 로드, 실행)
      - name: Deploy Backend
        run: |
          IMAGE="${{ secrets.DOCKER_USERNAME }}/community-backend:${{ github.sha }}"
          ssh \
            -i ~/.ssh/aydenKey.pem \
            -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -i ~/.ssh/aydenKey.pem -o StrictHostKeyChecking=no -W %h:%p ubuntu@${{ secrets.BASTION_HOST }}" \
            ubuntu@${{ secrets.BACKEND_PRIVATE_IP }} \
            "
              #이후 명령 중 하나라도 실패하면 -> 전체 실패처리
              set -e
              #아까 넘겨받은 이미지 로드하여 도커 이미지로 등록
              sudo docker load -i /tmp/community-backend.tar
              #기존의 컨테이너 중지 및 삭제 (컨테이너 X-> 그냥 넘어감 / 컨테이너 있는데 stop -> 실패)
              if sudo docker ps -a --format '{{.Names}}' | grep -qx 'community-backend'; then
                sudo docker stop community-backend
                sudo docker rm community-backend
              fi
              sudo docker run -d \
                --name community-backend \
                --restart always \
                -p 8080:8080 \
                --env-file /home/ubuntu/backend.env \
                '$IMAGE'
              #사용한 tar는 삭제
              rm -f /tmp/community-backend.tar"
      #이전에 배스천 보안그룹에 넣었던 러너IP 삭제하기
      - name: Remove TempIP from bastion SG
        #무조건 실행하게
        if: always()
        #앞의 authorize의 반대 <-> revoke, 규칙 삭제(생성한 거 그대로 삭제)
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id "${{ secrets.BASTION_SG_ID }}" \
            --protocol tcp \
            --port 22 \
            --cidr "${{ steps.runner-ip.outputs.cidr }}"
